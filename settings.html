<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置 · Trace</title><script src="theme.js"></script><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="settings.css"></head>
<body><aside class="settings-nav"><a class="settings-brand" href="./#tasks">T<span>TRACE</span></a><a href="./#tasks">← 返回任务</a><p>偏好设置</p><a class="selected" href="#floating">悬浮窗</a><a href="#appearance">外观</a></aside>
<main><header><span class="eyebrow">PREFERENCES</span><h1>设置</h1><p>让 Trace 按你的方式跟进任务。</p><span class="saved" id="saved" role="status">更改会立即生效</span></header>
<section id="floating"><div class="section-heading"><h2>悬浮窗</h2><p>进度放在身边，需要时再展开。</p></div><div class="panel"><label class="setting-row"><span><b>显示悬浮窗</b><small>在其他应用上方查看任务进度。</small></span><input type="checkbox" id="enabled" role="switch"></label><label class="setting-row"><span><b>贴边后自动收起</b><small>鼠标离开后只留小凸块，移入即可展开。</small></span><input type="checkbox" id="auto-hide" role="switch"></label><div class="setting-row"><span><b>吸附位置</b><small>也可拖动挂件，靠近屏幕边缘后松手吸附。</small></span><div class="segmented" aria-label="吸附位置"><label><input type="radio" name="edge" value="left">左侧</label><label><input type="radio" name="edge" value="right">右侧</label></div></div></div>
<div class="section-heading task-heading"><h2>显示哪些任务</h2><p>最多显示 4 项。废弃或删除的任务会自动从挂件中隐藏。</p></div><div class="panel"><div class="selection-mode"><label><input type="radio" name="task-mode" value="automatic"><span><b>自动显示当前任务</b><small>优先展示存在阻塞的任务。</small></span></label><label><input type="radio" name="task-mode" value="manual"><span><b>手动选择任务</b><small>只跟进你选择的任务，包含已完成的任务。</small></span></label></div><div id="task-picker" hidden><div class="picker-toolbar"><label><span class="sr-only">搜索任务</span><input type="search" id="task-search" placeholder="搜索任务名称或编号"></label><span id="selection-count"></span></div><div id="task-list"></div><p id="picker-note" class="picker-note" role="status"></p></div></div><p class="hint">挂件任意位置均可拖动。右键可打开设置或隐藏，⌘3 可显示或隐藏挂件。</p></section>
<section id="appearance"><div class="section-heading"><h2>外观</h2><p>工作台、悬浮窗和设置页保持一致。</p></div><fieldset class="panel theme-options"><legend class="sr-only">明暗模式</legend><label><input type="radio" name="mode" value="light" data-pref="mode"><span class="theme-swatch light"></span><b>浅色</b></label><label><input type="radio" name="mode" value="dark" data-pref="mode"><span class="theme-swatch dark"></span><b>深色</b></label><label><input type="radio" name="mode" value="system" data-pref="mode"><span class="theme-swatch system"></span><b>跟随系统</b></label></fieldset><p id="theme-note" class="hint">外观偏好保存在此设备。</p></section></main>
<script src="live.js"></script><script src="floating-prefs.js"></script><script src="settings.js"></script></body></html>
